      - name: player_name
        description: "Full player name."
      - name: team_id
        description: "BallDontLie unique team identifier."
      - name: team_name
        description: "Full team name."
      - name: season
        description: "NBA season identifier."
      - name: is_home
        description: "True if the player's team was the home team."
      - name: season_game_number
        description: "Sequential game number within the season for this player."
      # Current game actuals
      - name: minutes_played
        description: "Minutes played in this game."
      - name: pts
        description: "Points scored in this game."
      - name: reb
        description: "Total rebounds in this game."
      - name: oreb
        description: "Offensive rebounds in this game."
      - name: dreb
        description: "Defensive rebounds in this game."
      - name: ast
        description: "Assists in this game."
      - name: stl
        description: "Steals in this game."
      - name: blk
        description: "Blocks in this game."
      - name: turnovers
        description: "Turnovers in this game."
      - name: pf
        description: "Personal fouls in this game."
      - name: fgm
        description: "Field goals made in this game."
      - name: fga
        description: "Field goals attempted in this game."
      - name: fg3m
        description: "Three-pointers made in this game."
      - name: fg3a
        description: "Three-pointers attempted in this game."
      - name: ftm
        description: "Free throws made in this game."
      - name: fta
        description: "Free throws attempted in this game."
      - name: game_score
        description: "Hollinger Game Score for this game."
      - name: fg_pct
        description: "Field goal percentage in this game (FGM / FGA)."
      - name: fg3_pct
