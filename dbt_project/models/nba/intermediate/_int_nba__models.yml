version: 2

models:
  - name: int_nba__team_game_stats
    description: >
      Team-level game stats aggregated from player box scores.
      Grain: one row per (game_date, game_id, team_id) — two rows per game.
      Includes own stats, opponent stats, offensive/defensive rating,
      and estimated possessions.
    columns:
      - name: game_date
        description: "Date the game was played."
      - name: game_id
        description: "BallDontLie unique game identifier."
      - name: team_id
        description: "BallDontLie unique team identifier."
      - name: team_name
        description: "Full team name (e.g. Boston Celtics)."
      - name: season
        description: "NBA season identifier (e.g. 2024)."
      - name: is_home
        description: "True if this team was the home team."
      - name: home_team_score
        description: "Final score of the home team."
      - name: visitor_team_score
        description: "Final score of the visiting team."
      - name: score_margin
        description: "Home team score minus visitor team score."
      - name: total_points
        description: "Combined score of both teams."
      - name: is_postseason
        description: "True if this was a playoff game."
      - name: players_used
        description: "Number of players who appeared in the game for this team."
      - name: total_minutes
        description: "Sum of all player minutes for this team."
      - name: pts
        description: "Total team points scored."
      - name: reb
        description: "Total team rebounds."
      - name: oreb
        description: "Total team offensive rebounds."
      - name: dreb
        description: "Total team defensive rebounds."
      - name: ast
        description: "Total team assists."
      - name: stl
        description: "Total team steals."
      - name: blk
        description: "Total team blocks."
      - name: turnovers
        description: "Total team turnovers."
      - name: pf
        description: "Total team personal fouls."
      - name: fgm
        description: "Total team field goals made."
      - name: fga
        description: "Total team field goals attempted."
      - name: fg_pct
        description: "Team field goal percentage (FGM / FGA)."
      - name: fg3m
        description: "Total team three-pointers made."
      - name: fg3a
        description: "Total team three-pointers attempted."
      - name: fg3_pct
        description: "Team three-point percentage (FG3M / FG3A)."
      - name: ftm
        description: "Total team free throws made."
      - name: fta
        description: "Total team free throws attempted."
      - name: ft_pct
        description: "Team free throw percentage (FTM / FTA)."
      - name: est_possessions
        description: "Estimated possessions: FGA + 0.475*FTA - OREB + TOV."
      - name: efg_pct
        description: "Effective field goal percentage: (FGM + 0.5*FG3M) / FGA. Dean Oliver's #1 Four Factor."
      - name: tov_pct
        description: "Turnover percentage: TOV / (FGA + 0.475*FTA - OREB + TOV). Dean Oliver's #2 Four Factor."
      - name: ftr
        description: "Free throw rate: FTA / FGA. Dean Oliver's #4 Four Factor."
      - name: orb_pct
        description: "Offensive rebound percentage: OREB / (OREB + opponent DREB). Dean Oliver's #3 Four Factor."
      - name: off_rating
        description: "Points per 100 possessions."
      - name: def_rating
        description: "Opponent points per 100 possessions."
      - name: opp_efg_pct
        description: "Opponent's effective field goal percentage (what opponents shoot against this team's defense)."
      - name: opp_tov_pct
        description: "Opponent's turnover percentage (turnovers forced by this team's defense)."
      - name: opp_ftr
        description: "Opponent's free throw rate (fouls committed by this team's defense)."
      - name: opp_orb_pct
        description: "Opponent's offensive rebound percentage (offensive boards allowed by this team's defense)."
      - name: opp_team_id
        description: "Opponent team identifier."
      - name: opp_team_name
        description: "Opponent full team name."
      - name: opp_pts
        description: "Points scored by the opponent."

  - name: int_nba__consensus_lines
    description: >
      Consensus (median) betting lines across all bookmakers.
      Grain: one row per (game_date, event_id, market_key, side).
      Tracks median price/line, best/worst price, and line range.
    columns:
      - name: game_date
        description: "Date the game is scheduled (Eastern time)."
      - name: event_id
        description: "The Odds API unique event identifier."
      - name: season
        description: "NBA season identifier (e.g. 2024-25)."
      - name: home_team
        description: "Normalized home team name."
      - name: away_team
        description: "Normalized away team name."
      - name: commence_time_utc
        description: "Scheduled game start time in UTC."
      - name: commence_time_et
        description: "Scheduled game start time in Eastern."
      - name: market_key
        description: "Betting market type: h2h, spreads, or totals."
      - name: side
        description: "Bet side: team name (h2h/spreads) or Over/Under (totals)."
      - name: num_bookmakers
        description: "Count of bookmakers offering this line."
      - name: consensus_price
        description: "Median American odds across all bookmakers."
      - name: consensus_line
        description: "Median point spread or total line. NULL for h2h."
      - name: best_price
        description: "Best (lowest-vig) American odds among all bookmakers."
      - name: worst_price
        description: "Worst (highest-vig) American odds among all bookmakers."
      - name: min_line
        description: "Smallest point spread or total line across bookmakers."
      - name: max_line
        description: "Largest point spread or total line across bookmakers."
      - name: consensus_implied_prob
        description: "Median implied probability across all bookmakers."

  - name: int_nba__game_betting_results
    description: >
      Completed games joined with consensus lines to determine
      cover/push/miss outcomes for every bet type.
      Grain: one row per (game_date, game_id, market_key, side).
      Links Odds API to BDL via (game_date, home_team) natural key.
    columns:
      - name: game_date
        description: "Date the game was played."
      - name: game_id
        description: "BallDontLie unique game identifier."
      - name: event_id
        description: "The Odds API unique event identifier."
      - name: season
        description: "NBA season identifier."
      - name: home_team_name
        description: "Full home team name."
      - name: visitor_team_name
        description: "Full visiting team name."
      - name: home_team_score
        description: "Final score of the home team."
      - name: visitor_team_score
        description: "Final score of the visiting team."
      - name: score_margin
        description: "Home team score minus visitor team score."
      - name: total_points
        description: "Combined score of both teams."
      - name: is_postseason
        description: "True if this was a playoff game."
      - name: market_key
        description: "Betting market type: h2h, spreads, or totals."
      - name: side
        description: "Bet side: team name (h2h/spreads) or Over/Under (totals)."
      - name: consensus_line
        description: "Median point spread or total line used for cover evaluation."
      - name: consensus_price
        description: "Median American odds for this line."
      - name: consensus_implied_prob
        description: "Median implied probability for this line."
      - name: num_bookmakers
        description: "Count of bookmakers contributing to the consensus."
      - name: best_price
        description: "Best American odds available across bookmakers."
      - name: cover_result
        description: "COVERED, MISSED, or PUSH for this bet."

  - name: int_nba__team_rolling_stats
    description: >
      Per-team rolling averages: L10 (last 10 games) and season-to-date.
      Window frames exclude current game (1 PRECEDING) so values represent
      pre-game expectations. Powers predictions and game grades.
