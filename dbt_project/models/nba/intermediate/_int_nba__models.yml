      - name: l10_avg_ftr
        description: "L10 rolling average free throw rate (before this game)."
      - name: l10_avg_opp_efg_pct
        description: "L10 rolling average opponent eFG% — what opponents shoot against this team (before this game)."
      - name: l10_avg_opp_tov_pct
        description: "L10 rolling average opponent TO% — turnovers forced by this team (before this game)."
      - name: l10_avg_opp_orb_pct
        description: "L10 rolling average opponent ORB% — offensive boards allowed by this team (before this game)."
      - name: l10_avg_opp_ftr
