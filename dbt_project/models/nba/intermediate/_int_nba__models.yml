        description: "Season-to-date average assists (before this game)."
      - name: season_avg_turnovers
        description: "Season-to-date average turnovers (before this game)."
      - name: season_avg_stl
        description: "Season-to-date average steals (before this game)."
      - name: season_avg_blk
