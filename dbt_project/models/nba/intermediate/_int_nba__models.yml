        description: "True if this team was the home team."
      - name: opp_team_id
        description: "Opponent team identifier."
      - name: opp_team_name
        description: "Opponent full team name."
      - name: season_game_number
        description: "Sequential game number within the season for this team."
      # Current game actuals
      - name: pts
        description: "Team points scored in this game."
      - name: opp_pts
        description: "Opponent points scored in this game."
      - name: reb
        description: "Team rebounds in this game."
      - name: oreb
        description: "Team offensive rebounds in this game."
      - name: dreb
        description: "Team defensive rebounds in this game."
      - name: ast
        description: "Team assists in this game."
      - name: turnovers
        description: "Team turnovers in this game."
      - name: stl
        description: "Team steals in this game."
      - name: blk
        description: "Team blocks in this game."
      - name: pf
        description: "Team personal fouls in this game."
      - name: fgm
        description: "Team field goals made in this game."
      - name: fga
        description: "Team field goals attempted in this game."
      - name: fg_pct
        description: "Team field goal percentage in this game."
      - name: fg3m
        description: "Team three-pointers made in this game."
      - name: fg3a
        description: "Team three-pointers attempted in this game."
      - name: fg3_pct
        description: "Team three-point percentage in this game."
      - name: ftm
        description: "Team free throws made in this game."
      - name: fta
        description: "Team free throws attempted in this game."
      - name: ft_pct
        description: "Team free throw percentage in this game."
      - name: est_possessions
        description: "Estimated possessions in this game."
      - name: efg_pct
        description: "Effective field goal percentage in this game."
      - name: tov_pct
        description: "Turnover percentage in this game."
      - name: orb_pct
        description: "Offensive rebound percentage in this game."
      - name: ftr
        description: "Free throw rate in this game."
      - name: off_rating
        description: "Offensive rating (points per 100 possessions) in this game."
      - name: def_rating
        description: "Defensive rating (opponent points per 100 possessions) in this game."
      - name: opp_efg_pct
        description: "Opponent effective field goal percentage in this game."
      - name: opp_tov_pct
        description: "Opponent turnover percentage in this game."
      - name: opp_orb_pct
        description: "Opponent offensive rebound percentage in this game."
      - name: opp_ftr
        description: "Opponent free throw rate in this game."
      - name: score_margin
        description: "Home team score minus visitor team score in this game."
      - name: total_points
        description: "Combined score of both teams in this game."
      - name: rest_days
        description: "Days since this team's previous game. NULL for the first game of the season."
      # L10 rolling averages
      - name: l10_avg_pts
        description: "L10 rolling average points (before this game)."
      - name: l10_avg_opp_pts
        description: "L10 rolling average opponent points (before this game)."
      - name: l10_avg_reb
