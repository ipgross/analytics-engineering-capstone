      - name: l10_avg_ast
        description: "L10 rolling average assists (before this game)."
      - name: l10_avg_turnovers
        description: "L10 rolling average turnovers (before this game)."
      - name: l10_avg_stl
        description: "L10 rolling average steals (before this game)."
      - name: l10_avg_blk
        description: "L10 rolling average blocks (before this game)."
      - name: l10_avg_fg_pct
        description: "L10 rolling average field goal percentage (before this game)."
      - name: l10_avg_fg3_pct
        description: "L10 rolling average three-point percentage (before this game)."
      - name: l10_avg_ft_pct
        description: "L10 rolling average free throw percentage (before this game)."
      - name: l10_avg_possessions
        description: "L10 rolling average possessions (before this game)."
      - name: l10_avg_off_rating
        description: "L10 rolling average offensive rating (before this game)."
      - name: l10_avg_def_rating
        description: "L10 rolling average defensive rating (before this game)."
      - name: l10_avg_pf
        description: "L10 rolling average personal fouls (before this game)."
      # L10 Four Factors rolling averages
      - name: l10_avg_efg_pct
