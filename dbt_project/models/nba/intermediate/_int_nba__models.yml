  - name: int_nba__player_rolling_stats
    description: >
      Per-player rolling averages: L10 and season-to-date.
      Window frames exclude current game (1 PRECEDING) so values represent
      pre-game expectations. Includes Hollinger Game Score.
      Only players with minutes > 0. Powers player game grades.
      Grain: one row per (game_date, game_id, player_id).
