      - name: def_performance_grade
        description: "Letter grade A+ through F based on inverted def_rating delta vs L10. Positive delta = better defense."
      - name: performance_grade
        description: "Hybrid letter grade based on average of off and inverted def rating deltas vs L10."

  - name: mart_nba__player_game_grades
    description: >
      Post-game player performance grades comparing actual stats to L10
      rolling averages and season averages. Uses Hollinger's Game Score
      for the overall grade. No off/def split — box scores cannot produce
      true individual offensive/defensive ratings.
      Grain: one row per (game_date, game_id, player_id).
    columns:
      - name: game_date
        description: "Date the game was played."
      - name: game_id
        description: "BallDontLie game identifier."
      - name: player_id
        description: "BallDontLie player identifier."
      - name: player_name
        description: "Full name of the player."
      - name: team_id
        description: "BallDontLie team identifier."
      - name: team_name
        description: "Full team name."
      - name: season
        description: "NBA season identifier (e.g. 2024-25)."
      - name: is_home
        description: "True if the player's team was the home team."
      - name: season_game_number
        description: "Sequential game number for this player within the season."
      - name: minutes_played
        description: "Minutes played in this game."
      - name: pts
        description: "Actual points scored."
      - name: reb
        description: "Actual total rebounds."
      - name: ast
        description: "Actual assists."
      - name: stl
        description: "Actual steals."
      - name: blk
        description: "Actual blocks."
      - name: turnovers
        description: "Actual turnovers."
      - name: pf
        description: "Actual personal fouls."
      - name: fg_pct
        description: "Actual field goal percentage."
      - name: fg3_pct
        description: "Actual three-point percentage."
      - name: ft_pct
        description: "Actual free throw percentage."
      - name: game_score
        description: "Hollinger Game Score: PTS + 0.4*FGM - 0.7*FGA - 0.4*(FTA-FTM) + 0.7*OREB + 0.3*DREB + STL + 0.7*AST + 0.7*BLK - 0.4*PF - TOV."
      - name: home_spread
        description: "Consensus home spread from the game result."
      - name: spread_result
        description: "COVERED, MISSED, or PUSH for this player's team."
      - name: pts_delta_l10
        description: "Points minus L10 average."
      - name: reb_delta_l10
        description: "Rebounds minus L10 average."
      - name: ast_delta_l10
        description: "Assists minus L10 average."
      - name: stl_delta_l10
        description: "Steals minus L10 average."
      - name: blk_delta_l10
        description: "Blocks minus L10 average."
      - name: turnovers_delta_l10
        description: "Turnovers minus L10 average."
      - name: pf_delta_l10
        description: "Personal fouls minus L10 average."
      - name: fg_pct_delta_l10
        description: "Field goal percentage minus L10 average."
      - name: fg3_pct_delta_l10
        description: "Three-point percentage minus L10 average."
      - name: ft_pct_delta_l10
        description: "Free throw percentage minus L10 average."
      - name: game_score_delta_l10
        description: "Game score minus L10 average."
      - name: minutes_delta_l10
        description: "Minutes played minus L10 average."
      - name: pts_delta_season
        description: "Points minus season average."
      - name: reb_delta_season
        description: "Rebounds minus season average."
      - name: ast_delta_season
        description: "Assists minus season average."
